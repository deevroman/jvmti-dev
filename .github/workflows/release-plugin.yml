name: Release JVMTI Plugin

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build plugin (${{ matrix.java }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: java21
            arch: x64
            runner: ubuntu-24.04
            image: trickyfoxy/jvmti-dumper-dev:java21
            asset_name: libdumper-linux-x64-java21.so
          - java: java25
            arch: x64
            runner: ubuntu-24.04
            image: trickyfoxy/jvmti-dumper-dev:java25
            asset_name: libdumper-linux-x64-java25.so
          - java: java21
            arch: arm64
            runner: ubuntu-24.04-arm
            image: trickyfoxy/jvmti-dumper-dev:java21
            asset_name: libdumper-linux-arm64-java21.so
          - java: java25
            arch: arm64
            runner: ubuntu-24.04-arm
            image: trickyfoxy/jvmti-dumper-dev:java25
            asset_name: libdumper-linux-arm64-java25.so
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S src -B /tmp/dumper-build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build /tmp/dumper-build --config Release -j

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp /tmp/dumper-build/libdumper.so "dist/${{ matrix.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.java }}-${{ matrix.arch }}-plugin
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  upload-release:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: release-assets/**/*.so
